<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><style>
  html,body{margin:0;padding:0;width:1024px;height:1024px;overflow:hidden;background:#241640}
  svg{display:block;width:1024px;height:1024px}
</style></head>
<body>
<svg viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1d1038"/>
      <stop offset="0.42" stop-color="#4a2350"/>
      <stop offset="0.62" stop-color="#7a3a5c"/>
      <stop offset="0.74" stop-color="#c97a4a"/>
      <stop offset="0.78" stop-color="#e8973f"/>
      <stop offset="1" stop-color="#e8973f"/>
    </linearGradient>
    <linearGradient id="desert" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#eec39a"/>
      <stop offset="0.5" stop-color="#e3ac7c"/>
      <stop offset="1" stop-color="#c98d5e"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffd97a" stop-opacity="0.95"/>
      <stop offset="0.45" stop-color="#ffb347" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#ffb347" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="moonglow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#f7e8c9" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#f7e8c9" stop-opacity="0"/>
    </radialGradient>
    <!-- one clean camel in profile, facing right, ~160 wide x 100 tall:
         two clear humps, four separated legs, tail, thick curved neck + elongated head -->
    <g id="camel">
      <path d="M14,44 C18,30 26,18 36,18 C46,18 52,30 54,40 C56,44 58,44 60,42 C64,28 74,16 86,16 C98,16 104,28 106,40 C108,44 109,46 110,48 L110,62 L110,100 L100,100 L100,62 L86,62 L86,100 L76,100 L76,62 L50,62 L50,100 L40,100 L40,62 L26,62 L26,100 L16,100 L16,62 L14,62 L14,44 Z"/>
      <path d="M12,48 Q3,58 8,68" stroke="#2a1428" stroke-width="4" fill="none"/>
      <circle cx="8" cy="70" r="4" fill="#2a1428"/>
      <!-- thick curved neck + elongated head (blunt muzzle, held forward) -->
      <path d="M110,54 Q124,36 136,20" stroke="#2a1428" stroke-width="16" fill="none" stroke-linecap="round"/>
      <ellipse cx="146" cy="16" rx="12" ry="7" transform="rotate(-12 146 16)" fill="#2a1428"/>
    </g>
    <!-- rider sitting between the humps: torso + head rise above the back line -->
    <g id="rider">
      <circle cx="0" cy="-34" r="6.5"/>
      <path d="M-8,0 C-8,-12 -7,-26 -4,-32 L4,-32 C7,-26 8,-12 8,0 Z"/>
    </g>
  </defs>

  <!-- sky -->
  <rect x="0" y="0" width="1024" height="1024" fill="url(#sky)"/>

  <!-- stars -->
  <g fill="#f7e8c9">
    <circle cx="90" cy="70" r="2.2" opacity="0.9"/><circle cx="180" cy="140" r="1.6" opacity="0.7"/>
    <circle cx="260" cy="60" r="2.6" opacity="0.9"/><circle cx="330" cy="170" r="1.4" opacity="0.6"/>
    <circle cx="420" cy="90" r="2.0" opacity="0.8"/><circle cx="500" cy="150" r="1.5" opacity="0.6"/>
    <circle cx="580" cy="70" r="2.4" opacity="0.9"/><circle cx="660" cy="130" r="1.6" opacity="0.7"/>
    <circle cx="740" cy="60" r="2.0" opacity="0.8"/><circle cx="930" cy="220" r="1.8" opacity="0.7"/>
    <circle cx="120" cy="260" r="1.5" opacity="0.6"/><circle cx="950" cy="330" r="2.0" opacity="0.8"/>
    <circle cx="60" cy="380" r="1.8" opacity="0.7"/><circle cx="970" cy="120" r="1.5" opacity="0.6"/>
    <circle cx="210" cy="330" r="1.4" opacity="0.5"/><circle cx="700" cy="230" r="1.6" opacity="0.7"/>
    <circle cx="40" cy="500" r="1.6" opacity="0.6"/><circle cx="990" cy="470" r="1.6" opacity="0.6"/>
    <circle cx="470" cy="330" r="1.5" opacity="0.55"/><circle cx="90" cy="470" r="1.4" opacity="0.5"/>
  </g>

  <!-- crescent moon -->
  <circle cx="852" cy="118" r="110" fill="url(#moonglow)"/>
  <circle cx="852" cy="118" r="52" fill="#f7e8c9"/>
  <circle cx="872" cy="104" r="46" fill="#3a1d4e" opacity="0.92"/>

  <!-- place name -->
  <text x="512" y="238" text-anchor="middle" font-family="Georgia,'Times New Roman','Liberation Serif',serif" font-size="128" letter-spacing="26" fill="#f7e8c9" style="text-shadow:0 0 24px rgba(255,190,90,0.55)">KHARUN</text>
  <rect x="392" y="272" width="240" height="3" fill="#f7e8c9" opacity="0.85"/>

  <!-- distant dunes on the horizon -->
  <path d="M0,742 Q180,706 360,732 T720,724 T1024,738 L1024,1024 L0,1024 Z" fill="#8a4a5e" opacity="0.55"/>
  <path d="M0,756 Q220,726 470,748 T1024,752 L1024,1024 L0,1024 Z" fill="#6e3550" opacity="0.6"/>

  <!-- the cliff city: mesa + towers (lighter rose rock, visible strata) -->
  <g>
    <!-- mesa body -->
    <path d="M150,780 L150,640 L210,600 L260,600 L300,560 L360,560 L400,610 L470,610 L520,540 L590,540 L640,600 L700,600 L760,560 L830,560 L870,620 L900,640 L900,780 Z" fill="#5e2f4a"/>
    <!-- rock strata lines -->
    <g stroke="#7a4460" stroke-width="3" fill="none" opacity="0.8">
      <path d="M150,680 L900,680"/>
      <path d="M150,720 L900,720"/>
      <path d="M150,755 L900,755"/>
    </g>
    <g stroke="#4a2547" stroke-width="2" fill="none" opacity="0.7">
      <path d="M240,600 L240,780"/><path d="M470,610 L470,780"/><path d="M700,600 L700,780"/>
      <path d="M830,560 L830,780"/><path d="M360,560 L360,780"/>
    </g>
    <!-- tower domes, taller and distinct -->
    <path d="M520,540 L520,486 Q555,452 590,486 L590,540 Z" fill="#7a3a55"/>
    <path d="M300,560 L300,512 Q330,482 360,512 L360,560 Z" fill="#7a3a55"/>
    <path d="M760,560 L760,512 Q795,482 830,512 L830,560 Z" fill="#7a3a55"/>
    <!-- glowing arched windows -->
    <g fill="#f5b942">
      <rect x="176" y="668" width="14" height="26" rx="7"/><rect x="212" y="700" width="14" height="26" rx="7"/>
      <rect x="280" y="640" width="14" height="26" rx="7"/><rect x="330" y="690" width="14" height="26" rx="7"/>
      <rect x="420" y="668" width="14" height="26" rx="7"/><rect x="486" y="700" width="14" height="26" rx="7"/>
      <rect x="548" y="600" width="14" height="26" rx="7"/><rect x="600" y="668" width="14" height="26" rx="7"/>
      <rect x="660" y="700" width="14" height="26" rx="7"/><rect x="716" y="640" width="14" height="26" rx="7"/>
      <rect x="786" y="690" width="14" height="26" rx="7"/><rect x="840" y="668" width="14" height="26" rx="7"/>
      <rect x="548" y="648" width="12" height="22" rx="6"/><rect x="330" y="640" width="12" height="22" rx="6"/>
      <rect x="786" y="640" width="12" height="22" rx="6"/>
    </g>
    <!-- lantern strings between towers -->
    <g stroke="#2a1428" stroke-width="2" fill="none" opacity="0.9">
      <path d="M360,540 Q440,600 520,520"/>
      <path d="M590,520 Q675,600 760,540"/>
      <path d="M260,600 Q330,660 400,620"/>
      <path d="M640,610 Q740,672 830,600"/>
    </g>
    <g>
      <circle cx="390" cy="560" r="14" fill="url(#glow)"/><circle cx="390" cy="560" r="5" fill="#ffc65c"/>
      <circle cx="420" cy="572" r="14" fill="url(#glow)"/><circle cx="420" cy="572" r="5" fill="#ffc65c"/>
      <circle cx="452" cy="566" r="14" fill="url(#glow)"/><circle cx="452" cy="566" r="5" fill="#ffc65c"/>
      <circle cx="482" cy="548" r="14" fill="url(#glow)"/><circle cx="482" cy="548" r="5" fill="#ffc65c"/>
      <circle cx="625" cy="552" r="14" fill="url(#glow)"/><circle cx="625" cy="552" r="5" fill="#ffc65c"/>
      <circle cx="657" cy="566" r="14" fill="url(#glow)"/><circle cx="657" cy="566" r="5" fill="#ffc65c"/>
      <circle cx="690" cy="570" r="14" fill="url(#glow)"/><circle cx="690" cy="570" r="5" fill="#ffc65c"/>
      <circle cx="722" cy="560" r="14" fill="url(#glow)"/><circle cx="722" cy="560" r="5" fill="#ffc65c"/>
      <circle cx="292" cy="622" r="14" fill="url(#glow)"/><circle cx="292" cy="622" r="5" fill="#ffc65c"/>
      <circle cx="326" cy="636" r="14" fill="url(#glow)"/><circle cx="326" cy="636" r="5" fill="#ffc65c"/>
      <circle cx="362" cy="634" r="14" fill="url(#glow)"/><circle cx="362" cy="634" r="5" fill="#ffc65c"/>
      <circle cx="678" cy="636" r="14" fill="url(#glow)"/><circle cx="678" cy="636" r="5" fill="#ffc65c"/>
      <circle cx="714" cy="646" r="14" fill="url(#glow)"/><circle cx="714" cy="646" r="5" fill="#ffc65c"/>
      <circle cx="750" cy="644" r="14" fill="url(#glow)"/><circle cx="750" cy="644" r="5" fill="#ffc65c"/>
      <circle cx="786" cy="630" r="14" fill="url(#glow)"/><circle cx="786" cy="630" r="5" fill="#ffc65c"/>
    </g>
    <!-- warm light wash over the mesa base -->
    <rect x="150" y="742" width="750" height="38" fill="#e8973f" opacity="0.35"/>
  </g>

  <!-- salt desert floor -->
  <path d="M0,780 Q260,762 520,778 T1024,774 L1024,1024 L0,1024 Z" fill="url(#desert)"/>
  <path d="M0,830 Q300,806 620,826 T1024,822 L1024,1024 L0,1024 Z" fill="#d9a878" opacity="0.45"/>
  <path d="M0,900 Q340,872 700,894 T1024,890 L1024,1024 L0,1024 Z" fill="#c98d5e" opacity="0.35"/>
  <!-- soft long shadows from the city -->
  <path d="M220,786 L300,1024 L360,1024 L300,786 Z" fill="#a86a44" opacity="0.16"/>
  <path d="M640,786 L700,1024 L750,1024 L700,786 Z" fill="#a86a44" opacity="0.16"/>

  <!-- caravan: three camels walking toward the city -->
  <g fill="#2a1428">
    <g transform="translate(240,848)"><use href="#camel"/></g>
    <g transform="translate(300,890)"><use href="#rider"/></g>
    <g transform="translate(440,860) scale(0.85)"><use href="#camel"/></g>
    <g transform="translate(620,852) scale(0.95)"><use href="#camel"/></g>
  </g>
  <!-- sun-glow band on the horizon behind the city -->
  <rect x="0" y="736" width="1024" height="10" fill="#ffd97a" opacity="0.5"/>
</svg>
</body>
</html>
